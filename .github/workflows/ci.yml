name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Kalypsis.Cli.sln
      - run: dotnet build Kalypsis.Cli.sln -c Release --no-restore
      - run: dotnet test Kalypsis.Cli.sln -c Release --no-build
